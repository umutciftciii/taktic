# The staging / production stack (OPS-004, OPS-006).
#
# Standalone. Always run as:
#
#   docker compose -f docker-compose.prod.yml ...
#
# and normally only through scripts/ops/deploy-staging.sh. Naming a file with
# `-f` switches off Compose's automatic docker-compose.override.yml, so an
# untracked override on the host is NOT read — and nothing in this file
# depends on one. Every safety property is stated here:
#
#   * Immutable images (Dockerfile). No bind mount of the checkout, no
#     node_modules from the host, no `next dev` / ts-node-dev. A `git pull`
#     on the host changes nothing a container runs.
#   * Loopback-only publishing. api, web and admin are published on
#     127.0.0.1 and nowhere else; the host's tunnel (cloudflared) reaches them
#     there. The address is written literally, not read from a variable, so no
#     .env value can turn it into 0.0.0.0. scripts/ops/compose-security.mjs
#     fails CI if that ever changes.
#   * PostgreSQL is not published at all. Operators reach it with
#     `docker exec taktic-postgres psql ...`; the deploy, backup and restore
#     scripts do the same.
#   * Volume keys are the development stack's (`taktic-postgres-data`,
#     `taktic-api-uploads`), so under the same project name this file adopts
#     the existing data instead of starting an empty database. The project
#     name is therefore required, never guessed from the directory.
#
# Required from the host (.env next to this file, or the shell):
#
#   COMPOSE_PROJECT_NAME  the project the existing volumes belong to
#   TAKTIC_IMAGE_TAG      the commit the images were built from
#                         (scripts/ops/build-images.sh tags them with it)
#   APP_ENVIRONMENT       staging | production — never defaulted here
#   POSTGRES_PASSWORD     no default password on a deployed database
#
# Optional: TAKTIC_CONTAINER_PREFIX (default `taktic`, giving taktic-api etc.).
# Only a rehearsal stack beside a live one on the same machine changes it.
#
# Everything an application reads is forwarded by name, service by service,
# "empty when unset" unless docker-compose.yml already gives it a default — in
# which case the default is the same here, so a host moving from the
# development compose to this one keeps the behaviour it had. Secrets go only
# to the service that uses them; web and admin receive none of the API's.
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must name the project that owns the existing volumes}

x-hardening: &hardening
  # A real PID 1 (tini) that forwards SIGTERM: Node as PID 1 ignores it, so
  # every `docker stop` waited out its full timeout and then SIGKILLed.
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: ${TAKTIC_CONTAINER_PREFIX:-taktic}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taktic}
      POSTGRES_USER: ${POSTGRES_USER:-taktic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for a deployed database}
    # No `ports:`. Not published on any host address.
    volumes:
      - taktic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot migration tool, built from the same commit as the API. Never
  # started by `up`; the deploy script runs it explicitly:
  #   docker compose -f docker-compose.prod.yml run --rm migrate status|deploy|drift
  # Its entrypoint refuses `migrate dev`, `reset`, `db push` and every shadow
  # database (scripts/ops/prisma-migrate-guard.sh).
  migrate:
    <<: *hardening
    image: taktic-migrate:${TAKTIC_IMAGE_TAG:?TAKTIC_IMAGE_TAG must name the built commit}
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taktic_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for a deployed database}@postgres:5432/${POSTGRES_DB:-taktic}?schema=public

  api:
    <<: *hardening
    image: taktic-api:${TAKTIC_IMAGE_TAG:?TAKTIC_IMAGE_TAG must name the built commit}
    container_name: ${TAKTIC_CONTAINER_PREFIX:-taktic}-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Literal, like the loopback addresses: every deployed environment —
      # staging included — runs the production build as production. What
      # differs between staging and production is APP_ENVIRONMENT, and the
      # environment-dependent rules read that (the Lemon Squeezy sandbox, for
      # one, runs on APP_ENVIRONMENT=staging under NODE_ENV=production). The
      # former API_NODE_ENV override is gone; the deploy preflight's runtime
      # contract (scripts/ops/runtime-contract.mjs) fails anything else.
      NODE_ENV: production
      # The container's own port. The host side is API_PORT, below.
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-taktic_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for a deployed database}@postgres:5432/${POSTGRES_DB:-taktic}?schema=public
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:?APP_ENVIRONMENT must be staging or production}
      TRUST_PROXY: ${TRUST_PROXY:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-taktic_session}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-28800}
      SESSION_REMEMBER_ME_IDLE_TIMEOUT_SECONDS: ${SESSION_REMEMBER_ME_IDLE_TIMEOUT_SECONDS:-2592000}
      SESSION_REMEMBER_ME_TTL_SECONDS: ${SESSION_REMEMBER_ME_TTL_SECONDS:-2592000}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      SESSION_IDLE_WARNING_SECONDS: ${SESSION_IDLE_WARNING_SECONDS:-120}
      SESSION_REMEMBER_ME_IDLE_WARNING_SECONDS: ${SESSION_REMEMBER_ME_IDLE_WARNING_SECONDS:-86400}
      MESSAGE_RATE_LIMIT_MAX: ${MESSAGE_RATE_LIMIT_MAX:-10}
      MESSAGE_RATE_LIMIT_WINDOW_SECONDS: ${MESSAGE_RATE_LIMIT_WINDOW_SECONDS:-60}
      SERVICE_REQUEST_RATE_LIMIT_MAX: ${SERVICE_REQUEST_RATE_LIMIT_MAX:-}
      SERVICE_REQUEST_RATE_LIMIT_WINDOW_SECONDS: ${SERVICE_REQUEST_RATE_LIMIT_WINDOW_SECONDS:-}
      REQUEST_DRAFT_MAX_ACTIVE: ${REQUEST_DRAFT_MAX_ACTIVE:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3002}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      WEB_APP_URL: ${WEB_APP_URL:-}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      EMAIL_ASSET_BASE_URL: ${EMAIL_ASSET_BASE_URL:-}
      # Scheduler cadence (the on/off switches live in the database).
      UNVIEWED_OFFER_REFUND_CRON: ${UNVIEWED_OFFER_REFUND_CRON:-0 * * * *}
      UNVIEWED_OFFER_REFUND_LIMIT: ${UNVIEWED_OFFER_REFUND_LIMIT:-100}
      REQUEST_EXPIRY_SCHEDULER_CRON: ${REQUEST_EXPIRY_SCHEDULER_CRON:-15 * * * *}
      REQUEST_REMINDER_SCHEDULER_CRON: ${REQUEST_REMINDER_SCHEDULER_CRON:-45 * * * *}
      REQUEST_LIFECYCLE_SCAN_LIMIT: ${REQUEST_LIFECYCLE_SCAN_LIMIT:-200}
      CAMPAIGN_EVALUATION_RETRY_CRON: ${CAMPAIGN_EVALUATION_RETRY_CRON:-*/1 * * * *}
      ENTITLEMENT_RENEWAL_CRON: ${ENTITLEMENT_RENEWAL_CRON:-}
      SHOWCASE_LEAD_SLA_CRON: ${SHOWCASE_LEAD_SLA_CRON:-}
      SHOWCASE_PLACEMENT_EXPIRY_CRON: ${SHOWCASE_PLACEMENT_EXPIRY_CRON:-}
      SHOWCASE_SCAN_LIMIT: ${SHOWCASE_SCAN_LIMIT:-}
      # Deprecated switches. They decide nothing (the on/off switches are
      # OperationsSettings rows). Forwarded empty by default, so a host that
      # sets none boots without a warning; a host that still sets one gets the
      # API's boot warning naming it. Never give them a default value here: any
      # non-empty value, "false" included, is a set variable and warns.
      UNVIEWED_OFFER_REFUND_ENABLED: ${UNVIEWED_OFFER_REFUND_ENABLED:-}
      REQUEST_EXPIRY_SCHEDULER_ENABLED: ${REQUEST_EXPIRY_SCHEDULER_ENABLED:-}
      REQUEST_REMINDER_SCHEDULER_ENABLED: ${REQUEST_REMINDER_SCHEDULER_ENABLED:-}
      ENTITLEMENT_RENEWAL_SCHEDULER_ENABLED: ${ENTITLEMENT_RENEWAL_SCHEDULER_ENABLED:-}
      CONTACT_SHARING_ENABLED: ${CONTACT_SHARING_ENABLED:-true}
      CONTACT_DISCLOSURE_URL: ${CONTACT_DISCLOSURE_URL:-}
      CONTACT_DISCLOSURE_VERSION: ${CONTACT_DISCLOSURE_VERSION:-}
      PROVIDER_CLAIM_ENABLED: ${PROVIDER_CLAIM_ENABLED:-}
      REQUIRE_PHONE_VERIFICATION: ${REQUIRE_PHONE_VERIFICATION:-}
      # Refused at boot unless APP_ENVIRONMENT is local/staging and NODE_ENV
      # is not production; forwarded so a staging host keeps what it set.
      PHONE_VERIFICATION_TEST_BYPASS_ENABLED: ${PHONE_VERIFICATION_TEST_BYPASS_ENABLED:-}
      PHONE_VERIFICATION_TEST_BYPASS_PHONES: ${PHONE_VERIFICATION_TEST_BYPASS_PHONES:-}
      PHONE_VERIFICATION_TEST_BYPASS_CODE: ${PHONE_VERIFICATION_TEST_BYPASS_CODE:-}
      PHONE_VERIFICATION_TEST_BYPASS_EXPIRES_AT: ${PHONE_VERIFICATION_TEST_BYPASS_EXPIRES_AT:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-console}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_TIMEOUT_MS: ${RESEND_TIMEOUT_MS:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_INBOX_EMAIL: ${SUPPORT_INBOX_EMAIL:-}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_POSTAL_ADDRESS: ${COMPANY_POSTAL_ADDRESS:-}
      # Payment provider. Same sandbox-only contract as docker-compose.yml:
      # no LEMON_SQUEEZY_LIVE_* / PAYMENT_LIVE_ENABLED is forwarded, and the
      # loopback test seam LEMON_SQUEEZY_API_BASE_URL is not forwarded either.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      LEMON_SQUEEZY_MODE: ${LEMON_SQUEEZY_MODE:-}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY:-}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID:-}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET:-}
      LEMON_SQUEEZY_VARIANT_MAP: ${LEMON_SQUEEZY_VARIANT_MAP:-}
      LEMON_SQUEEZY_TIMEOUT_MS: ${LEMON_SQUEEZY_TIMEOUT_MS:-}
      TURNSTILE_MODE: ${TURNSTILE_MODE:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAMES: ${TURNSTILE_EXPECTED_HOSTNAMES:-}
      TURNSTILE_SITEVERIFY_TIMEOUT_MS: ${TURNSTILE_SITEVERIFY_TIMEOUT_MS:-}
      PURCHASE_TERMS_GATE: ${PURCHASE_TERMS_GATE:-}
      PROMOTION_FINGERPRINT_KEY: ${PROMOTION_FINGERPRINT_KEY:-}
      PROMOTION_FINGERPRINT_KEY_VERSION: ${PROMOTION_FINGERPRINT_KEY_VERSION:-}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      # The same volume key and the same mount point as the development
      # stack: <cwd>/uploads with cwd = /app/apps/api.
      - taktic-api-uploads:/app/apps/api/uploads

  web:
    <<: *hardening
    image: taktic-web:${TAKTIC_IMAGE_TAG:?TAKTIC_IMAGE_TAG must name the built commit}
    container_name: ${TAKTIC_CONTAINER_PREFIX:-taktic}-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:3001
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-taktic_session}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:?APP_ENVIRONMENT must be staging or production}
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-}
      TURNSTILE_MODE: ${TURNSTILE_MODE:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      WEB_APP_URL: ${WEB_APP_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      PROVIDER_CLAIM_ENABLED: ${PROVIDER_CLAIM_ENABLED:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  admin:
    <<: *hardening
    image: taktic-admin:${TAKTIC_IMAGE_TAG:?TAKTIC_IMAGE_TAG must name the built commit}
    container_name: ${TAKTIC_CONTAINER_PREFIX:-taktic}-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:3001
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-taktic_session}
      ADMIN_CONFIRMATION_PROOF_SECRET: ${ADMIN_CONFIRMATION_PROOF_SECRET:-}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3002}:3002"

volumes:
  taktic-postgres-data:
  taktic-api-uploads:
