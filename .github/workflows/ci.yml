name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A merge into main used to re-run the whole suite on a commit whose tree
  # the pull request had already tested — every one of the last 30 merges
  # landed exactly the tree its PR run checked out, on exactly the base it was
  # checked out on. This job, on pushes only, proves that from GitHub's records
  # (see .github/scripts/post-merge-gate.mjs) and answers `reuse=true` only
  # when every link holds. Anything else — a direct push, a base that moved, a
  # different tree, a PR run that is missing, pending, failed or incomplete,
  # an API error, this job failing — leaves `reuse` unset or false, and the
  # jobs below run in full. When they are not run they show as skipped,
  # never as passed, and this job's summary links the PR run that tested the
  # tree. Pull requests never run this job: all of them always run there.
  post-merge-gate:
    name: post-merge gate (reuse PR result only for an identical tree)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: decide
        name: Compare this push with the PR run that tested it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/post-merge-gate.mjs

  # Pull requests only: records which merge commit this run tests, for the
  # gate above to find once the PR is merged. The run's API record carries the
  # PR head, not the merge commit, so the SHA goes into an artifact's name.
  # It also runs the gate's own tests and the CI result rule's, so a change to
  # either is proven by the same pull request that makes it.
  pr-evidence:
    name: record tested merge commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Test the post-merge gate and the CI result rule
        run: node --test .github/scripts/post-merge-gate.test.mjs .github/scripts/ci-result.test.mjs
      - name: Record the merge commit under test
        run: git rev-parse HEAD | tee tested-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-tested-commit-${{ github.sha }}
          path: tested-commit.txt
          retention-days: 14

  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    needs: post-merge-gate
    # `!cancelled()` so that a skipped gate (every pull request) does not skip
    # this job; `!= 'true'` so that only a proven reuse does.
    if: ${{ !cancelled() && needs.post-merge-gate.outputs.reuse != 'true' }}

    services:
      # Integration tests need a real PostgreSQL: they exercise Serializable
      # transactions, unique constraints and the credit ledger, none of which a
      # mock would reproduce faithfully.
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: taktic
          POSTGRES_USER: taktic_user
          POSTGRES_PASSWORD: taktic_password
        ports:
          - 5432:5432
        # The data directory lives on a tmpfs: every byte PostgreSQL writes in
        # this job is thrown away with the runner, so a disk is only latency —
        # and on a hosted runner that latency is what varies from one VM to the
        # next (the same commit has taken 13 and 47 minutes). Memory does not
        # vary. 2 GiB is an explicit ceiling, not a reservation: tmpfs takes
        # only what is written, and the databases here are tens of megabytes;
        # the ceiling leaves room for the WAL, which max_wal_size (1 GiB by
        # default) lets grow before a checkpoint recycles it. The durability
        # settings that pair with this are applied by the first step below —
        # a service takes no command-line arguments.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U taktic_user -d taktic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite derives its own database (<name>_test) from this URL and
      # refuses to run against anything not ending in _test, so the job never
      # touches the database named here.
      DATABASE_URL: postgresql://taktic_user:taktic_password@localhost:5432/taktic?schema=public
      AUTH_COOKIE_NAME: taktic_session

    steps:
      # Durability off, because there is nothing to be durable for: the data
      # directory is a tmpfs (see the service above) and vanishes with the
      # runner. fsync, synchronous_commit and full_page_writes only decide when
      # a write is forced to storage; constraints, transactions and isolation
      # levels are not touched, so the suite proves exactly what it proved
      # before. They are set here rather than on the server command line
      # because a service container takes none: `options` are `docker create`
      # flags. All three are reloadable, so a reload is enough and nothing
      # restarts. The step then reads back the mount and the settings and
      # fails unless both are what this job relies on — the log carries the
      # evidence, and only that: docker exec speaks over the container's
      # socket, so no password or connection string appears anywhere.
      - name: Configure PostgreSQL for disposable CI storage
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -q -U taktic_user -d taktic \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

          mount=$(docker exec "$PG" awk '$2 == "/var/lib/postgresql/data" { print $3, $4 }' /proc/mounts)
          echo "data directory mount: ${mount:-<none>}"
          case "$mount" in
            tmpfs*) ;;
            *) echo "::error::PostgreSQL data directory is not on a tmpfs"; exit 1 ;;
          esac

          settings=$(docker exec "$PG" psql -v ON_ERROR_STOP=1 -tA -U taktic_user -d taktic \
            -c "SELECT name || '=' || setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes') ORDER BY name")
          echo "$settings"
          [ "$(printf '%s\n' "$settings" | tr '\n' ' ')" = "fsync=off full_page_writes=off synchronous_commit=off " ] \
            || { echo "::error::PostgreSQL durability settings were not applied"; exit 1; }

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Release version
        run: |
          node --test scripts/release/version-check.test.mjs
          pnpm version:check
          echo "release version: $(pnpm --silent version:check --print)"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # CI-FONTS-001: the build must not need a font service. Every font host
      # is unreachable from here on, so a build that still fetches one fails.
      - name: Block font services
        run: .github/scripts/block-font-services.sh

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    needs: post-merge-gate
    if: ${{ !cancelled() && needs.post-merge-gate.outputs.reuse != 'true' }}

    # A separate job, not extra steps on `verify`: it needs a browser and boots
    # six application processes, so keeping it apart means a type error still
    # fails in a minute instead of waiting behind a browser download. Both jobs
    # start together, so the wall-clock cost to a PR is the slower of the two.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: taktic
          POSTGRES_USER: taktic_user
          POSTGRES_PASSWORD: taktic_password
        ports:
          - 5432:5432
        # Same tmpfs and ceiling as `verify`, for the same reason; the first
        # step below applies the matching durability settings.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U taktic_user -d taktic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # This job gets its own PostgreSQL service container, so nothing is shared
      # with `verify` in the first place. On top of that the suite derives
      # `taktic_e2e` from this URL and refuses to start against any database
      # whose name does not end in _e2e — the integration suite's `taktic_test`
      # included.
      DATABASE_URL: postgresql://taktic_user:taktic_password@localhost:5432/taktic?schema=public
      AUTH_COOKIE_NAME: taktic_session

    steps:
      # Identical to the step of the same name on `verify`; see the notes there.
      - name: Configure PostgreSQL for disposable CI storage
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -q -U taktic_user -d taktic \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

          mount=$(docker exec "$PG" awk '$2 == "/var/lib/postgresql/data" { print $3, $4 }' /proc/mounts)
          echo "data directory mount: ${mount:-<none>}"
          case "$mount" in
            tmpfs*) ;;
            *) echo "::error::PostgreSQL data directory is not on a tmpfs"; exit 1 ;;
          esac

          settings=$(docker exec "$PG" psql -v ON_ERROR_STOP=1 -tA -U taktic_user -d taktic \
            -c "SELECT name || '=' || setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes') ORDER BY name")
          echo "$settings"
          [ "$(printf '%s\n' "$settings" | tr '\n' ' ')" = "fsync=off full_page_writes=off synchronous_commit=off " ] \
            || { echo "::error::PostgreSQL durability settings were not applied"; exit 1; }

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      # Chromium only. The critical journeys are about server actions, sessions
      # and pricing rules — none of which differ by browser engine — so a second
      # engine would double the runtime of every PR to re-test the same API.
      - name: Install Chromium
        run: pnpm e2e:install

      # CI-FONTS-001: the build must not need a font service. Every font host
      # is unreachable from here on, so a build that still fetches one fails
      # (`pnpm e2e` builds web and admin first).
      - name: Block font services
        run: .github/scripts/block-font-services.sh

      - name: End-to-end tests
        run: pnpm e2e

      # Traces, screenshots and videos are only written for failures
      # (see playwright.config.ts), so this uploads a debugging bundle exactly
      # when there is something to debug.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/.artifacts/test-results
            e2e/.artifacts/report
          retention-days: 7
          if-no-files-found: ignore

  e2e-webkit:
    name: e2e (webkit · sign-in and mobile shells)
    runs-on: ubuntu-latest
    needs: post-merge-gate
    if: ${{ !cancelled() && needs.post-merge-gate.outputs.reuse != 'true' }}

    # Its own job rather than a second project on the one above, for the reason
    # that one is Chromium-only: a second engine over the whole suite would
    # double every pull request to re-test the same API. What WebKit is here for
    # is the two things an engine really decides — the cookie each sign-in flow
    # leaves the browser holding, where the reported Safari failure was, and the
    # panel layouts at phone widths, where the reported iPhone one was. It runs
    # those specs and nothing else, in parallel with the job above and without
    # adding a browser download to it.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: taktic
          POSTGRES_USER: taktic_user
          POSTGRES_PASSWORD: taktic_password
        ports:
          - 5432:5432
        # Same tmpfs and ceiling as `verify`, for the same reason; the first
        # step below applies the matching durability settings.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U taktic_user -d taktic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same derivation and same refusal as the job above: the suite appends
      # _e2e and will not start against anything else. The two jobs get separate
      # service containers, so they do not share the database either.
      DATABASE_URL: postgresql://taktic_user:taktic_password@localhost:5432/taktic?schema=public
      AUTH_COOKIE_NAME: taktic_session

    steps:
      # Identical to the step of the same name on `verify`; see the notes there.
      - name: Configure PostgreSQL for disposable CI storage
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -q -U taktic_user -d taktic \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

          mount=$(docker exec "$PG" awk '$2 == "/var/lib/postgresql/data" { print $3, $4 }' /proc/mounts)
          echo "data directory mount: ${mount:-<none>}"
          case "$mount" in
            tmpfs*) ;;
            *) echo "::error::PostgreSQL data directory is not on a tmpfs"; exit 1 ;;
          esac

          settings=$(docker exec "$PG" psql -v ON_ERROR_STOP=1 -tA -U taktic_user -d taktic \
            -c "SELECT name || '=' || setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes') ORDER BY name")
          echo "$settings"
          [ "$(printf '%s\n' "$settings" | tr '\n' ' ')" = "fsync=off full_page_writes=off synchronous_commit=off " ] \
            || { echo "::error::PostgreSQL durability settings were not applied"; exit 1; }

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Install WebKit
        run: pnpm e2e:install:webkit

      # CI-FONTS-001: the build must not need a font service. Every font host
      # is unreachable from here on, so a build that still fetches one fails
      # (`pnpm e2e:webkit` builds web and admin first).
      - name: Block font services
        run: .github/scripts/block-font-services.sh

      - name: Sign-in screens and mobile shells (WebKit)
        run: pnpm e2e:webkit

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-artifacts
          path: |
            e2e/.artifacts/test-results
            e2e/.artifacts/report
          retention-days: 7
          if-no-files-found: ignore

  ops:
    name: ops (compose · scripts · production images)
    runs-on: ubuntu-latest
    needs: post-merge-gate
    if: ${{ !cancelled() && needs.post-merge-gate.outputs.reuse != 'true' }}

    # The deploy contract (OPS-004 / OPS-006 / OPS-002), proven on every pull
    # request without touching any real host. Its own job, in parallel with
    # the others: it needs Docker, not the browser or the integration
    # database, and its few minutes of image builds sit well inside the e2e
    # job's runtime, so it adds nothing to a PR's wall-clock time.
    #
    #   0. secret scan (STG-003): no credential and no well-known starting
    #      password in any tracked file; a finding prints its place and a
    #      redacted preview, never the value
    #   1. shell scripts: bash -n + shellcheck (warnings and above)
    #   2. compose security: the audit's own tests, then the audit of the
    #      real files — docker-compose.prod.yml alone must publish api, web and
    #      admin on 127.0.0.1 only and PostgreSQL nowhere
    #   3. the four production images, built from `git archive` of this commit
    #   4. what is inside them: no .env / .git / dumps, non-root, no dev tools
    #   5. boot: a throwaway prod stack on an empty database — migrate deploy
    #      through the guard, api/web/admin healthy, then scripts/ops/smoke.sh.
    #      Configured as staging runs: NODE_ENV=production (the file's literal),
    #      APP_ENVIRONMENT=staging, Lemon Squeezy's sandbox provider, Resend
    #   6. the deploy preflight and `deploy-staging.sh --check` against that
    #      running stack, then the uploads ownership fix on a real root-owned
    #      volume, with a second volume proving nothing else is touched
    #   7. backup + isolated restore rehearsal of that database
    #   8. P3009 recovery against the real migrate image's Prisma, on a
    #      throwaway PostgreSQL with no network: a failing migration rolls
    #      back whole, one that commits half-way does not (and the recovery
    #      analysis says so), and the guard refuses resolve-rolled-back outside
    #      staging or unconfirmed, while Prisma refuses a migration that is not
    #      in a failed state
    #
    # Placeholders only: the .env written below holds no secret (Cloudflare's
    # published always-pass Turnstile test keys and throwaway values in the
    # shape each reader expects; nothing here contacts Lemon Squeezy or
    # Resend). The public URLs are example.test names: the stack is reached
    # over its loopback ports, and the runtime contract wants public https.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Secret scan
        run: |
          node --test scripts/security/secret-scan.test.mjs
          node scripts/security/secret-scan.mjs

      - name: Shell scripts
        run: |
          for f in scripts/ops/*.sh .github/scripts/*.sh; do bash -n "$f"; done
          shellcheck --version | head -n 2
          shellcheck -S warning -x -P scripts/ops scripts/ops/*.sh
          shellcheck -S warning .github/scripts/*.sh

      - name: Compose security
        run: |
          node --test scripts/ops/compose-security.test.mjs scripts/ops/runtime-contract.test.mjs scripts/ops/ops-scripts.test.mjs scripts/ops/migration-recovery.test.mjs
          node scripts/ops/compose-security.mjs prod
          node scripts/ops/compose-security.mjs dev

      - name: Throwaway stack environment
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=taktic-ci
          APP_ENVIRONMENT=staging
          POSTGRES_PASSWORD=ci-placeholder
          NEXT_PUBLIC_API_URL=https://api-staging.example.test
          NEXT_PUBLIC_WEB_URL=https://staging.example.test
          API_PUBLIC_URL=https://api-staging.example.test
          WEB_APP_URL=https://staging.example.test
          WEB_ORIGIN=https://staging.example.test
          ADMIN_ORIGIN=https://admin-staging.example.test
          TURNSTILE_MODE=cloudflare
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_EXPECTED_HOSTNAMES=staging.example.test,admin-staging.example.test
          TRUST_PROXY=1
          WEB_TRUST_PROXY=true
          PROMOTION_FINGERPRINT_KEY=ci-placeholder-fingerprint-key-not-a-secret-0001
          PROMOTION_FINGERPRINT_KEY_VERSION=1
          # OBS-ALERT-002: base64 of the 32-byte text "ci-placeholder-recipient-key-001".
          OPS_ALERT_RECIPIENT_ENC_KEYS=v1:Y2ktcGxhY2Vob2xkZXItcmVjaXBpZW50LWtleS0wMDE=
          OPS_ALERT_RECIPIENT_ENC_KEY_ACTIVE=v1
          OPS_ALERT_RECIPIENT_HMAC_KEY=ci-placeholder-recipient-hmac-key-not-a-secret-0001
          OPS_ALERT_RECIPIENT_HMAC_KEY_VERSION=1
          EMAIL_TRANSPORT=resend
          RESEND_API_KEY=re_ciPlaceholderNotARealKey
          EMAIL_FROM="Taktick <noreply@notify.taktick.com.tr>"
          PAYMENT_PROVIDER=lemon-squeezy-test
          LEMON_SQUEEZY_API_KEY=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.ciPlaceholderNotARealCredential
          LEMON_SQUEEZY_STORE_ID=424242
          LEMON_SQUEEZY_WEBHOOK_SECRET=ci-placeholder-webhook-secret-not-real
          LEMON_SQUEEZY_VARIANT_MAP=baslangic:111,profesyonel:222
          EOF
          echo "TAKTIC_IMAGE_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TAKTIC_BACKUP_DIR=$RUNNER_TEMP/taktic-backups" >> "$GITHUB_ENV"

      - name: Build production images
        run: scripts/ops/build-images.sh "$TAKTIC_IMAGE_TAG"

      - name: Image contents
        run: scripts/ops/check-image-contents.sh "$TAKTIC_IMAGE_TAG"

      - name: Boot the production stack and smoke it
        run: |
          set -euo pipefail
          prod() { docker compose -f docker-compose.prod.yml "$@"; }
          node scripts/ops/compose-security.mjs prod --use-env
          prod up -d --wait postgres
          prod --profile tools run --rm --no-deps -T migrate deploy
          prod --profile tools run --rm --no-deps -T migrate status
          prod --profile tools run --rm --no-deps -T migrate drift
          prod up -d --no-deps --wait --wait-timeout 180 api
          prod up -d --no-deps --wait --wait-timeout 180 web admin
          scripts/ops/smoke.sh --sha "$TAKTIC_IMAGE_TAG"
          test "$(docker exec taktic-api printenv NODE_ENV)" = production

      - name: Readiness through a database outage
        run: |
          set -euo pipefail
          # OBS-READY-001 on the real image: readiness reports the migrations
          # this commit ships; with PostgreSQL stopped it is a 503 while
          # liveness stays 200 and the API process neither exits nor restarts;
          # with PostgreSQL back the same process is ready again.
          ready() { curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 10 http://127.0.0.1:3001/health/ready || echo 000; }
          expected="$(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | wc -l | tr -d ' ')"
          test "$(ready)" = 200
          grep -q "\"applied\":$expected}" /tmp/ready.json || { cat /tmp/ready.json; exit 1; }
          started="$(docker inspect -f '{{.State.StartedAt}}' taktic-api)"
          restarts="$(docker inspect -f '{{.RestartCount}}' taktic-api)"

          docker stop taktic-postgres >/dev/null
          code="$(ready)"; cat /tmp/ready.json; echo
          test "$code" = 503
          grep -q '"database":"\(unreachable\|timeout\)"' /tmp/ready.json
          if grep -qi 'postgres\|5432\|taktic_user' /tmp/ready.json; then echo "readiness names the connection" >&2; exit 1; fi
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3001/health)" = 200
          # Long enough for the image's healthcheck (10 s × 6 retries) to call
          # the container unhealthy: an unhealthy status must restart nothing.
          sleep 75
          test "$(docker inspect -f '{{.State.Health.Status}}' taktic-api)" = unhealthy
          test "$(docker inspect -f '{{.State.Running}}' taktic-api)" = true
          test "$(docker inspect -f '{{.State.StartedAt}}' taktic-api)" = "$started"
          test "$(docker inspect -f '{{.RestartCount}}' taktic-api)" = "$restarts"

          docker start taktic-postgres >/dev/null
          for _ in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' taktic-postgres)" = healthy ] && break; sleep 2; done
          for _ in $(seq 1 30); do [ "$(ready)" = 200 ] && break; sleep 2; done
          test "$(ready)" = 200
          grep -q "\"applied\":$expected}" /tmp/ready.json
          # The image's healthcheck agrees on its own, with no recreate.
          for _ in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' taktic-api)" = healthy ] && break; sleep 2; done
          test "$(docker inspect -f '{{.State.Health.Status}}' taktic-api)" = healthy
          test "$(docker inspect -f '{{.State.StartedAt}}' taktic-api)" = "$started"

      - name: Deploy preflight and --check against the running stack
        run: |
          set -euo pipefail
          # Every check passes on the staging contract, including the new
          # image's own boot checks (5c) and migrate status, and --check
          # neither fetches nor builds nor writes.
          scripts/ops/deploy-preflight.sh --sha "$TAKTIC_IMAGE_TAG" --skip-fetch --deploy-ref HEAD --project taktic-ci
          scripts/ops/deploy-staging.sh --sha "$TAKTIC_IMAGE_TAG" --check --deploy-ref HEAD --project taktic-ci
          test ! -e "$TAKTIC_BACKUP_DIR"

      - name: Uploads ownership fix on a real volume
        run: |
          set -euo pipefail
          helper() { docker run --rm --network none "$@"; }
          volume=taktic-ci_taktic-api-uploads
          sentinel=taktic-ci-ownership-sentinel
          test "$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app/apps/api/uploads"}}{{.Name}}{{end}}{{end}}' taktic-api)" = "$volume"
          # The staging host's state: a volume the old root dev API wrote, and
          # a second volume the fix must never touch.
          helper -v "$volume:/u" postgres:16.6-alpine sh -c 'mkdir -p /u/category-images && printf ci-data > /u/category-images/a.png && chown -R 0:0 /u'
          docker volume create "$sentinel" >/dev/null
          helper -v "$sentinel:/s" postgres:16.6-alpine sh -c 'mkdir -p /s/d && printf keep > /s/d/f && chown -R 0:0 /s'
          before="$(helper -v "$volume:/u:ro" postgres:16.6-alpine sh -c 'cd /u && find . -type f -exec sha256sum {} + | sort')"

          if scripts/ops/deploy-preflight.sh --sha "$TAKTIC_IMAGE_TAG" --skip-fetch --deploy-ref HEAD --project taktic-ci; then
            echo "the preflight accepted a root-owned uploads volume without --allow-uploads-ownership-fix" >&2
            exit 1
          fi
          scripts/ops/deploy-preflight.sh --sha "$TAKTIC_IMAGE_TAG" --skip-fetch --deploy-ref HEAD --project taktic-ci \
            --allow-uploads-ownership-fix

          bash -c 'source scripts/ops/lib.sh; uploads_ownership_fix "$1" "$(image_runtime_ids "taktic-api:$2")"' _ "$volume" "$TAKTIC_IMAGE_TAG"

          after="$(helper -v "$volume:/u:ro" postgres:16.6-alpine sh -c 'cd /u && find . -type f -exec sha256sum {} + | sort')"
          test "$before" = "$after"
          test -z "$(helper -v "$volume:/u:ro" postgres:16.6-alpine sh -c 'find /u ! -user 1000 -o ! -group 1000')"
          test "$(helper -v "$sentinel:/s:ro" postgres:16.6-alpine sh -c 'find /s -exec stat -c %u:%g {} + | sort -u')" = "0:0"
          docker exec taktic-api sh -c 'touch uploads/category-images/.write-probe && rm uploads/category-images/.write-probe'
          scripts/ops/deploy-preflight.sh --sha "$TAKTIC_IMAGE_TAG" --skip-fetch --deploy-ref HEAD --project taktic-ci
          docker volume rm "$sentinel" >/dev/null

      - name: Backup and isolated restore rehearsal
        run: |
          set -euo pipefail
          dump="$(scripts/ops/backup-db.sh --label ci | sed -n 's/^BACKUP_FILE=//p')"
          archive="$(scripts/ops/backup-uploads.sh --label ci --allow-empty | sed -n 's/^UPLOADS_ARCHIVE=//p')"
          scripts/ops/restore-rehearsal.sh --db-dump "$dump" --uploads-archive "$archive" \
            --migrate-image "taktic-migrate:$TAKTIC_IMAGE_TAG"

      - name: P3009 recovery against real Prisma and PostgreSQL
        run: |
          set -euo pipefail
          image="taktic-migrate:$TAKTIC_IMAGE_TAG"
          lab="$RUNNER_TEMP/p3009-lab"
          net=taktic-p3009-lab
          pg=taktic-p3009-lab-pg
          for case in atomic commit; do
            mkdir -p "$lab/$case/migrations/20990101000000_ok" "$lab/$case/migrations/20990102000000_fail"
            printf 'datasource db {\n  provider = "postgresql"\n  url      = env("DATABASE_URL")\n}\nmodel Probe {\n  id Int @id\n}\n' >"$lab/$case/schema.prisma"
            printf 'provider = "postgresql"\n' >"$lab/$case/migrations/migration_lock.toml"
            printf 'CREATE TABLE "Probe" ("id" INTEGER PRIMARY KEY);\n' >"$lab/$case/migrations/20990101000000_ok/migration.sql"
          done
          printf 'CREATE TABLE "LabA" ("id" INTEGER);\nALTER TABLE "Probe" ADD COLUMN "x" INTEGER;\nINSERT INTO "Probe" VALUES (1);\nDO $$ BEGIN RAISE EXCEPTION %s; END $$;\n' "'lab guard'" \
            >"$lab/atomic/migrations/20990102000000_fail/migration.sql"
          printf 'CREATE TABLE "LabB" ("id" INTEGER);\nCOMMIT;\nCREATE TABLE "LabC" ("id" INTEGER);\nSELECT 1/0;\n' \
            >"$lab/commit/migrations/20990102000000_fail/migration.sql"
          docker network create --internal "$net" >/dev/null
          docker run -d --name "$pg" --network "$net" -e POSTGRES_USER=lab -e POSTGRES_PASSWORD=lab -e POSTGRES_DB=lab_atomic postgres:16.6-alpine >/dev/null
          # Over TCP: the image's first-start server (initdb) listens on the
          # socket only and is then restarted, so a socket check can pass on it.
          until docker exec "$pg" pg_isready -q -h 127.0.0.1 -U lab -d lab_atomic; do sleep 1; done
          docker exec "$pg" psql -X -q -U lab -d lab_atomic -c 'CREATE DATABASE lab_commit'
          url() { echo "postgresql://lab:lab@$pg:5432/$1"; }
          q() { docker exec -i "$pg" psql -X -tA -v ON_ERROR_STOP=1 -U lab -d "$1" -c "$2"; }
          for case in atomic commit; do
            if docker run --rm --network "$net" -e DATABASE_URL="$(url "lab_$case")" -v "$lab/$case:/lab:ro" \
                --entrypoint /app/node_modules/.bin/prisma "$image" migrate deploy --schema /lab/schema.prisma; then
              echo "the failing lab migration ($case) applied" >&2; exit 1
            fi
            # Prisma records the same thing in both cases: unfinished, 0 steps.
            test "$(q "lab_$case" "SELECT applied_steps_count FROM _prisma_migrations WHERE migration_name = '20990102000000_fail' AND finished_at IS NULL")" = 0
          done
          # Atomic: nothing the file did survived, and the analysis agrees.
          test "$(q lab_atomic "SELECT to_regclass('\"LabA\"') IS NULL AND NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'Probe' AND column_name = 'x') AND (SELECT count(*) FROM \"Probe\") = 0")" = t
          node scripts/ops/migration-recovery.mjs analyze <"$lab/atomic/migrations/20990102000000_fail/migration.sql"
          test -z "$(node scripts/ops/migration-recovery.mjs verify-sql <"$lab/atomic/migrations/20990102000000_fail/migration.sql" | q lab_atomic "$(cat)" | grep '|1$' || true)"
          # Commit half-way: LabB survived, and the analysis refuses the file.
          test "$(q lab_commit "SELECT to_regclass('\"LabB\"') IS NOT NULL AND to_regclass('\"LabC\"') IS NULL")" = t
          if node scripts/ops/migration-recovery.mjs analyze <"$lab/commit/migrations/20990102000000_fail/migration.sql"; then
            echo "the analysis accepted a file that commits half-way" >&2; exit 1
          fi
          node scripts/ops/migration-recovery.mjs verify-sql <"$lab/commit/migrations/20990102000000_fail/migration.sql" | q lab_commit "$(cat)" | grep -qx 'relation|LabB|1'
          # The guard of the real image.
          name=20261006120000_user_phone_e164_check
          guard() { docker run --rm --network "$net" -e DATABASE_URL="$(url lab_atomic)" "$@"; }
          set +e
          guard -e APP_ENVIRONMENT=production -e TAKTIC_RESOLVE_CONFIRM="$name" "$image" resolve-rolled-back "$name"; prod_code=$?
          guard -e APP_ENVIRONMENT=staging "$image" resolve-rolled-back "$name"; unconfirmed_code=$?
          guard -e APP_ENVIRONMENT=staging -e TAKTIC_RESOLVE_CONFIRM="$name" "$image" resolve "$name"; bare_code=$?
          # Confirmed on staging, but the migration is not failed here: Prisma refuses.
          guard -e APP_ENVIRONMENT=staging -e TAKTIC_RESOLVE_CONFIRM="$name" "$image" resolve-rolled-back "$name"; prisma_code=$?
          set -e
          test "$prod_code" = 64 && test "$unconfirmed_code" = 64 && test "$bare_code" = 64
          test "$prisma_code" -ne 0
          test "$(q lab_atomic "SELECT count(*) FROM _prisma_migrations WHERE migration_name = '$name'")" = 0
          docker rm -f "$pg" >/dev/null
          docker network rm "$net" >/dev/null

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 200 || true

  # The one check branch protection requires on main (CI-PROTECT-001), under a
  # name that does not change when a job above is renamed or added.
  #
  # Not the jobs above themselves: GitHub counts a skipped required check as
  # passed, and every job here is skipped somewhere by design — the gate on
  # every pull request, the full jobs on a push whose PR run is reused. This
  # job runs whatever happened above (`always()`: a cancelled or failed run
  # still reports, and reports a failure) and decides in
  # .github/scripts/ci-result.mjs what passing means for each event:
  #
  #   pull_request  pr-evidence, verify, e2e, e2e-webkit and ops all succeeded
  #                 on this exact head; skipped, cancelled or failed is a fail
  #   push (main)   the gate succeeded, and either it proved reuse and the full
  #                 jobs skipped for that reason, or every full job succeeded
  #
  # Branch protection's "up to date" rule keeps the PR run's tested merge
  # commit on the current main, which is also what lets the gate prove reuse.
  ci-result:
    name: CI result
    if: always()
    needs: [post-merge-gate, pr-evidence, verify, e2e, e2e-webkit, ops]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Every job this event requires succeeded
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-result.mjs
