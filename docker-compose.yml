services:
  postgres:
    image: postgres:16.6-alpine
    container_name: taktic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taktic}
      POSTGRES_USER: ${POSTGRES_USER:-taktic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taktic_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - taktic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: node:22-alpine
    container_name: taktic-api
    working_dir: /app
    # Dependencies, then the Prisma client, then the API. The generate step
    # is not redundant with the host's: /app/node_modules is a named volume,
    # so a client generated on the host never reaches this container and a
    # freshly added model reads as `undefined` inside it. Regenerating on
    # every start makes "recreate the container" the one reliable way to pick
    # up a schema change.
    #
    # This is client generation only. It applies no migration and replaces no
    # `migrate deploy`; the migration lifecycle is unchanged.
    #
    # Only the API gets it — web and admin never import @prisma/client.
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @taktic/api dev"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taktic_user}:${POSTGRES_PASSWORD:-taktic_password}@postgres:5432/${POSTGRES_DB:-taktic}?schema=public
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-taktic_session}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-28800}
      SESSION_REMEMBER_ME_TTL_SECONDS: ${SESSION_REMEMBER_ME_TTL_SECONDS:-2592000}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      SESSION_IDLE_WARNING_SECONDS: ${SESSION_IDLE_WARNING_SECONDS:-120}
      MESSAGE_RATE_LIMIT_MAX: ${MESSAGE_RATE_LIMIT_MAX:-10}
      MESSAGE_RATE_LIMIT_WINDOW_SECONDS: ${MESSAGE_RATE_LIMIT_WINDOW_SECONDS:-60}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3002}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      REFUND_SCHEDULER_ENABLED: ${REFUND_SCHEDULER_ENABLED:-false}
      REFUND_SCHEDULER_CRON: ${REFUND_SCHEDULER_CRON:-0 * * * *}
      REFUND_SCAN_OLDER_THAN_HOURS: ${REFUND_SCAN_OLDER_THAN_HOURS:-48}
      REFUND_SCAN_LIMIT: ${REFUND_SCAN_LIMIT:-100}
      REQUEST_EXPIRY_SCHEDULER_ENABLED: ${REQUEST_EXPIRY_SCHEDULER_ENABLED:-false}
      REQUEST_EXPIRY_SCHEDULER_CRON: ${REQUEST_EXPIRY_SCHEDULER_CRON:-15 * * * *}
      REQUEST_REMINDER_SCHEDULER_ENABLED: ${REQUEST_REMINDER_SCHEDULER_ENABLED:-false}
      REQUEST_REMINDER_SCHEDULER_CRON: ${REQUEST_REMINDER_SCHEDULER_CRON:-45 * * * *}
      REQUEST_LIFECYCLE_SCAN_LIMIT: ${REQUEST_LIFECYCLE_SCAN_LIMIT:-200}
      # On unless the host environment says otherwise. Opening the two parties'
      # details to each other is the outcome a match exists to produce, and a
      # stack that configures nothing should run the product rather than a
      # version of it with the result switched off. This default used to be
      # `false`, which is why an accepted offer left both screens blank.
      #
      # The two settings below stay empty here. Empty means unset, and unset
      # means the API links its own disclosure page — the one this repository
      # serves and versions in code. A deployment with its own published legal
      # text sets *both* of them; setting one alone is still a boot failure.
      CONTACT_SHARING_ENABLED: ${CONTACT_SHARING_ENABLED:-true}
      CONTACT_DISCLOSURE_URL: ${CONTACT_DISCLOSURE_URL:-}
      CONTACT_DISCLOSURE_VERSION: ${CONTACT_DISCLOSURE_VERSION:-}
      # console|file-outbox|resend. The dev stack keeps the console adapter:
      # nothing leaves the container and the links land in the API log. Only
      # EMAIL_TRANSPORT=resend delivers, and it then requires RESEND_API_KEY —
      # which belongs in the host environment, never in this file.
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-console}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      # mock|lemon-squeezy-test. The dev stack keeps the mock provider unless
      # the host environment says otherwise, which is the historical behaviour:
      # an in-app checkout form that settles nothing.
      #
      # The Lemon Squeezy settings below are read by the API only when
      # PAYMENT_PROVIDER=lemon-squeezy-test, and they are forwarded here rather
      # than left out because this service is the only one that may see them —
      # the web and admin containers deliberately get none of them. Each is
      # forwarded as "empty when unset", which the configuration reader treats
      # exactly like unset: an unconfigured stack still boots on `mock`, and a
      # stack switched to `lemon-squeezy-test` without them fails at boot with
      # the variable's *name* and never its contents.
      #
      # Sandbox credentials only, and only ever from your untracked local .env
      # or your shell — never from a file that is committed. There is no live
      # mode to configure: LEMON_SQUEEZY_LIVE_*, PAYMENT_LIVE_ENABLED and a
      # LEMON_SQUEEZY_MODE other than "test" all stop the API at boot, and none
      # of them is forwarded here.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      LEMON_SQUEEZY_MODE: ${LEMON_SQUEEZY_MODE:-}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY:-}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID:-}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET:-}
      LEMON_SQUEEZY_VARIANT_MAP: ${LEMON_SQUEEZY_VARIANT_MAP:-}
      LEMON_SQUEEZY_TIMEOUT_MS: ${LEMON_SQUEEZY_TIMEOUT_MS:-}
      # A test seam: points the checkout adapter at a stand-in sandbox API. The
      # configuration reader accepts it only for https or loopback and refuses
      # it under NODE_ENV=production.
      LEMON_SQUEEZY_API_BASE_URL: ${LEMON_SQUEEZY_API_BASE_URL:-}
      # Force polling-based file watching so tsx/chokidar reliably detect
      # host edits under the macOS bind mount. inotify events don't cross
      # the Docker Desktop VirtioFS/gRPC-FUSE boundary on macOS.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - .:/app
      - taktic-api-root-node-modules:/app/node_modules
      - taktic-api-node-modules:/app/apps/api/node_modules
      - taktic-shared-node-modules:/app/packages/shared/node_modules
      - taktic-api-pnpm-store:/root/.local/share/pnpm/store
      # Persist admin-uploaded category images so they survive container
      # rebuilds and `docker compose down`. The mount overlays the
      # repo-tracked apps/api/uploads/.gitkeep skeleton with the named
      # volume's contents at runtime.
      - taktic-api-uploads:/app/apps/api/uploads

  web:
    image: node:22-alpine
    container_name: taktic-web
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @taktic/web dev"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      API_INTERNAL_URL: http://api:3001
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-taktic_session}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - taktic-web-root-node-modules:/app/node_modules
      - taktic-web-node-modules:/app/apps/web/node_modules
      - taktic-web-next:/app/apps/web/.next
      - taktic-shared-node-modules:/app/packages/shared/node_modules
      - taktic-web-pnpm-store:/root/.local/share/pnpm/store

  admin:
    image: node:22-alpine
    container_name: taktic-admin
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @taktic/admin dev"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      API_INTERNAL_URL: http://api:3001
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-taktic_session}
    ports:
      - "${ADMIN_PORT:-3002}:3002"
    volumes:
      - .:/app
      - taktic-admin-root-node-modules:/app/node_modules
      - taktic-admin-node-modules:/app/apps/admin/node_modules
      - taktic-admin-next:/app/apps/admin/.next
      - taktic-shared-node-modules:/app/packages/shared/node_modules
      - taktic-admin-pnpm-store:/root/.local/share/pnpm/store

volumes:
  taktic-postgres-data:
  taktic-api-pnpm-store:
  taktic-web-pnpm-store:
  taktic-admin-pnpm-store:
  taktic-api-root-node-modules:
  taktic-web-root-node-modules:
  taktic-admin-root-node-modules:
  taktic-api-node-modules:
  taktic-web-node-modules:
  taktic-admin-node-modules:
  taktic-web-next:
  taktic-admin-next:
  taktic-shared-node-modules:
  taktic-api-uploads:
